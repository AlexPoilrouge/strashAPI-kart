root_dir: /
install_dir: /var/api/strash-api

docker_test: "{{ docker_test_flag | default(false) }}"

systemd:
  install: true

nginx:
  install: true

git:
  url: https://github.com/AlexPoilrouge/strashAPI-kart.git
  branch: "{{ git_branch_var | default('master') }}"
  cloned_repo_dir: /var/sources/strashAPI-kart
  remove_on_finish: true

strashbot:
  username: strashbot
  home: "/home/strashbot"

api:
  config:
    host: "localhost"
    port: 6029
    base_path: "/kart"
    has_https: "false"
  nginx:
    access_addr: "127.0.0.1"
    access_port: 6029
    access_server_names:
      - strashbot.fr
      - www.strashbot.fr
    is_own_server: true
    strashbot_conf_dirname: "sites-enabled"
  service:
    workdir: "../.."
  signing_keys:
    admin_filepath: "config/admin_jwtRS256.key.pub"
    discord_user_filepath: "config/jwtRS256.key.pub"
  features:
    clips:
      thumbnail_gen_cmd: "ffmpeg -i '__url__' -qscale:v __sectime__ -frames:v __framenum__ -vf scale=__outsize__ __outfilename__"
      thumbnail_survey_cron_string: "* 6 * * *"

mongo_db:
  username: strashbot
  password: "Zpas5wordX_"
  address: mongo
  main_db_name: ""
  strashbot_db_main: strashbotkarting_db

racers:
  - name: ringracers
    default: true
    port: 5029
    thumbnail_url: http://strashbot.fr/img/server/active_thumb.png
    aliases:
      - "strashbot"
      - "strash"
      - "here"
      - "us"
      - "home"
    addresses:
      - "strashbot.fr"
      - "193.70.41.86"
    core_commands:
      - name: service
        type: local
        cmd: "sh \\\"$( getent passwd 'strashbot' | cut -d: -f6 )/.ringracers/racer_operator.sh\\\" \\\"IS_SERVICE_ACTIVE\\\""
        timeout: 5000
    additionnal_commands:
      - name: "modes"
        type: local
        cmd: "sh \\\"$( getent passwd 'strashbot' | cut -d: -f6 )/.ringracers/racer_operator.sh\\\" \\\"MODE_INFO\\\""
        timeout: 8000
    local_directory: /home/strashbot/.ringracers/addons
  - name: srb2kart
    port: 5028
    thumbnail_url: http://strashbot.fr/img/server/active_thumb.png
    aliases:
      - "strashbot_srb2k"
      - "strashbot_old"
      - "srb2kart"
    addresses:
      - "strashbot.fr"
      - "193.70.41.86"
    core_commands:
      - name: service
        type: local
        cmd: "sh \\\"$( getent passwd 'strashbot' | cut -d: -f6 )/.srb2kart/racer_operator.sh\\\" \\\"IS_SERVICE_ACTIVE\\\""
        timeout: 5000
    local_directory: /home/strashbot/.srb2kart/addons    

others:
  - aliases:
      - "patafoin"
    addresses:
      - "146.59.237.103"
    port: 5029
