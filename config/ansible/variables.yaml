root_dir: /
install_dir: /var/api/strash-api

docker_test: "{{ docker_test_flag | default(false) }}"

systemd:
  install: true

nginx:
  install: true

git:
  url: https://github.com/AlexPoilrouge/strashAPI-kart.git
  branch: "{{ git_branch_var | default('master') }}"
  cloned_repo_dir: /var/sources/strashAPI-kart
  remove_on_finish: true

strashbot:
  username: strashbot
  home: "/home/strashbot"

api:
  config:
    host: "localhost:6029"
    port: 6029
    base_path: "/"
    has_https: "false"
  nginx:
    access_addr: "127.0.0.1"
    access_port: 6029
    access_server_names:
      - "strashbot.fr"
      - "www.strashbot.fr"
    is_own_server: true
    strashbot_conf_dirname: "strashbot_web_http_server"
  service:
    workdir: "../.."
  signing_keys:
    admin_filepath: "config/admin_jwtRS256.key.pub"
    discord_user_filepath: "config/jwtRS256.key.pub"
  features:
    clips:
      thumbnail_gen_cmd: "ffmpeg -i '__url__' -qscale:v __sectime__ -frames:v __framenum__ -vf scale=__outsize__ __outfilename__"
      thumbnail_survey_cron_string: "* 6 * * *"
  file_fetch_max_size_mb: 256

mongo_db:
  username: strashbot
  password: "Zpas5wordX_"
  address: localhost
  main_db_name: strashbotkarting_db
  strashbot_db_main: strashbotkarting_db

racers:
  - name: ringracers
    default: true
    port: 5029
    thumbnail_url: http://strashbot.fr/img/server/active_thumb.png
    aliases:
      - "strashbot"
      - "strash"
      - "here"
      - "us"
      - "home"
    addresses:
      - "strashbot.fr"
      - "193.70.41.86"
      - "localhost"
      - "127.0.0.1"
    core_commands:
      - name: service
        type: local
        cmd: "sh \\\"$( getent passwd 'strashbot' | cut -d: -f6 )/.ringracers/racer_operator.sh\\\" \\\"IS_SERVICE_ACTIVE\\\""
        timeout: 5000
      - name: restart
        type: local
        cmd: "echo '{ \\\"state\\\": \\\"ok\\\" }'"
        timeout: 5000
      - name: stop
        type: local
        cmd: "echo '{ \\\"state\\\": \\\"cooldown\\\", \\\"remaining_seconds\\\": 156 }'"
        timeout: 5000
      - name: pending_ops
        type: local
        cmd: "sh \\\"$( getent passwd 'strashbot' | cut -d: -f6 )/.ringracers/racer_operator.sh\\\" \\\"PENDING\\\""
        timeout: 16000
    additionnal_commands:
      - name: "modes"
        type: local
        cmd: "sh \\\"$( getent passwd 'strashbot' | cut -d: -f6 )/.ringracers/racer_operator.sh\\\" \\\"MODE_INFO\\\""
        timeout: 8000
    addons_directory: /home/strashbot/.ringracers/addons
    cfg_directory: /home/strashbot/.ringracers/cfg
    password_file: /home/strashbot/.ringracers/.TMP_PASS

others:
  - aliases:
      - "patafoin"
    addresses:
      - "146.59.237.103"
    port: 5029
